<!-- @format -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Posts Manager</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header class="app-header">
        <h1>Posts Manager</h1>
        <button id="openModalBtn" class="btn btn-primary">+ Add New Post</button>
      </header>

      <!-- Controls Bar: Search & Sort -->
      <section class="controls-bar">
        <div class="search-group">
          <input type="text" id="searchInput" placeholder="Search by title..." />
          <button id="searchBtn" class="btn btn-secondary">Search</button>
        </div>

        <div class="sort-group">
          <label for="sortSelect">Sort by:</label>
          <select id="sortSelect">
            <option value="">Default</option>
            <option value="title-asc">Title (A &rarr; Z)</option>
            <option value="title-desc">Title (Z &rarr; A)</option>
            <option value="id-asc">ID (Ascending)</option>
            <option value="id-desc">ID (Descending)</option>
          </select>
        </div>
      </section>

      <!-- Main Posts Display Container -->
      <main>
        <div id="loadingIndicator" class="loading hidden">Loading posts...</div>
        <div id="errorContainer" class="error-banner hidden"></div>

        <div id="postsContainer" class="posts-grid">
          <!-- Dynamic Post Cards will render here -->
        </div>
      </main>

      <!-- Pagination Footer -->
      <footer class="pagination-footer">
        <button id="prevBtn" class="btn btn-secondary">Previous</button>
        <span id="pageIndicator">Page 1</span>
        <button id="nextBtn" class="btn btn-secondary">Next</button>
      </footer>
    </div>

    <!-- Add Post Modal -->
    <div id="postModal" class="modal hidden">
      <div class="modal-content">
        <span id="closeModalBtn" class="close-btn">&times;</span>
        <h2>Add New Post</h2>

        <form id="addPostForm">
          <div class="form-group">
            <label for="postTitle">Title</label>
            <input type="text" id="postTitle" placeholder="Enter title (max 30 chars, no digits)" />
            <small id="titleError" class="error-msg"></small>
          </div>

          <div class="form-group">
            <label for="postBody">Body</label>
            <textarea id="postBody" rows="4" placeholder="Enter post content (no digits)"></textarea>
            <small id="bodyError" class="error-msg"></small>
          </div>

          <button type="submit" class="btn btn-primary btn-block">Submit Post</button>
        </form>

        <!-- Success Result Box Inside Modal -->
        <div id="successResult" class="success-box hidden">
          <h3>Post Created Successfully! 🎉</h3>
          <p><strong>ID:</strong> <span id="resId"></span></p>
          <p><strong>Title:</strong> <span id="resTitle"></span></p>
          <p><strong>Body:</strong> <span id="resBody"></span></p>
          <button id="modalCloseSuccessBtn" class="btn btn-primary btn-block">Close</button>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
